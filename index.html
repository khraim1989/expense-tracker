<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 متابع المصاريف</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/recharts@2.10.0/dist/Recharts.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 24px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 36px;
            font-weight: bold;
            color: white;
            margin-bottom: 8px;
        }
        .header p {
            color: #94a3b8;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 24px;
            margin-bottom: 32px;
        }
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .card h2 {
            font-size: 20px;
            font-weight: bold;
            color: white;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
        }
        .card h2 svg {
            width: 20px;
            height: 20px;
            margin-right: 8px;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            font-size: 14px;
            font-weight: 600;
            color: #cbd5e1;
            display: block;
            margin-bottom: 4px;
        }
        .input-group input,
        .input-group select {
            width: 100%;
            padding: 8px 12px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            border-radius: 4px;
            font-size: 14px;
        }
        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: #d4a574;
        }
        button {
            width: 100%;
            background: #b45309;
            hover: #92400e;
            color: white;
            font-weight: bold;
            padding: 10px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 14px;
        }
        button:hover {
            background: #92400e;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .stat-card {
            background: linear-gradient(135deg, #d4a574 0%, #b45309 100%);
            border-radius: 8px;
            padding: 24px;
            color: white;
        }
        .stat-card.small {
            background: #334155;
        }
        .stat-card h3 {
            font-size: 12px;
            opacity: 0.9;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
        }
        .expenses-list {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 32px;
        }
        .list-header {
            background: #334155;
            padding: 16px 24px;
            border-bottom: 1px solid #475569;
        }
        .list-header h3 {
            font-size: 18px;
            font-weight: bold;
            color: white;
        }
        .list-items {
            max-height: 400px;
            overflow-y: auto;
        }
        .list-item {
            padding: 16px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background 0.2s;
        }
        .list-item:hover {
            background: #334155;
        }
        .list-item-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }
        .list-item-icon {
            font-size: 24px;
        }
        .list-item-info h4 {
            color: white;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .list-item-info p {
            color: #94a3b8;
            font-size: 12px;
        }
        .list-item-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .list-item-amount {
            font-size: 18px;
            font-weight: bold;
            color: #fbbf24;
        }
        .delete-btn {
            background: transparent;
            color: #f87171;
            border: none;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 18px;
            width: auto;
        }
        .delete-btn:hover {
            color: #dc2626;
        }
        .empty-message {
            padding: 32px;
            text-align: center;
            color: #64748b;
        }
        .filter-section {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .filter-section label {
            font-weight: 600;
            color: white;
        }
        .filter-section input {
            flex: 1;
            min-width: 150px;
        }
        .print-btn {
            background: #2563eb;
        }
        .print-btn:hover {
            background: #1d4ed8;
        }
        @media print {
            body {
                background: white;
            }
            .card, .expenses-list, .stat-card {
                background: white;
                border: 1px solid #e5e7eb;
            }
            .filter-section {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ExpenseTracker() {
            const categories = [
                { id: 'restaurants', name: 'مطاعم', color: '#d4a574', icon: '🍽️' },
                { id: 'coffee', name: 'قهوة', color: '#8b6f47', icon: '☕' },
                { id: 'gas', name: 'بنزين', color: '#e74c3c', icon: '⛽' },
                { id: 'home', name: 'مشتريات منزلية', color: '#3498db', icon: '🏠' },
                { id: 'shopping', name: 'تسوق', color: '#9b59b6', icon: '🛍️' },
                { id: 'utilities', name: 'فواتير', color: '#f39c12', icon: '💡' },
                { id: 'transport', name: 'مواصلات', color: '#16a085', icon: '🚗' },
                { id: 'health', name: 'صحة وعافية', color: '#e67e22', icon: '⚕️' },
                { id: 'entertainment', name: 'ترفيه', color: '#2980b9', icon: '🎬' },
                { id: 'other', name: 'آخر', color: '#95a5a6', icon: '📌' }
            ];

            const initialData = [
                { id: 1, description: 'قهوة دانكن', amount: 11.00, category: 'coffee', date: '2026-08-02' },
                { id: 2, description: 'طعام Keeta توصيل', amount: 70.60, category: 'restaurants', date: '2026-08-02' },
                { id: 3, description: 'Hungerstation أول', amount: 39.30, category: 'restaurants', date: '2026-08-02' },
                { id: 4, description: 'Hungerstation ثاني', amount: 38.30, category: 'restaurants', date: '2026-08-02' },
                { id: 5, description: 'هدايا', amount: 230.00, category: 'shopping', date: '2026-08-02' },
                { id: 6, description: 'هدية عيد الزواج', amount: 3400.00, category: 'shopping', date: '2026-08-02' },
                { id: 7, description: 'آيسكريم ماكدونالدز', amount: 39.00, category: 'restaurants', date: '2026-08-02' }
            ];

            const [expenses, setExpenses] = useState(initialData);
            const [description, setDescription] = useState('');
            const [amount, setAmount] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('other');
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [filterMonth, setFilterMonth] = useState('2026-08');

            const addExpense = () => {
                if (description && amount && selectedCategory) {
                    setExpenses([...expenses, {
                        id: Date.now(),
                        description,
                        amount: parseFloat(amount),
                        category: selectedCategory,
                        date
                    }]);
                    setDescription('');
                    setAmount('');
                    setDate(new Date().toISOString().split('T')[0]);
                }
            };

            const deleteExpense = (id) => {
                setExpenses(expenses.filter(e => e.id !== id));
            };

            const filteredExpenses = expenses.filter(e => e.date.substring(0, 7) === filterMonth);
            const monthTotal = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);
            const avgDaily = filteredExpenses.length > 0 ? Math.round(monthTotal / new Set(filteredExpenses.map(e => e.date)).size) : 0;

            const categoryTotals = categories.map(cat => {
                const total = filteredExpenses.filter(e => e.category === cat.id).reduce((sum, e) => sum + e.amount, 0);
                return { ...cat, total };
            }).filter(ct => ct.total > 0);

            const topCategory = categoryTotals.length > 0 ? categoryTotals.reduce((max, cat) => cat.total > max.total ? cat : max) : null;

            return (
                <div className="container">
                    <div className="header">
                        <h1>💰 متابع المصاريف</h1>
                        <p>تحكم كامل في نفقاتك اليومية</p>
                    </div>

                    <div className="grid">
                        <div className="card">
                            <h2>➕ إضافة مصروف</h2>
                            <div className="input-group">
                                <label>الوصف</label>
                                <input type="text" value={description} onChange={(e) => setDescription(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addExpense()} placeholder="مثال: غداء في مطعم" />
                            </div>
                            <div className="input-group">
                                <label>المبلغ (ر.س)</label>
                                <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} onKeyPress={(e) => e.key === 'Enter' && addExpense()} placeholder="0.00" step="0.5" />
                            </div>
                            <div className="input-group">
                                <label>التصنيف</label>
                                <select value={selectedCategory} onChange={(e) => setSelectedCategory(e.target.value)}>
                                    {categories.map(cat => <option key={cat.id} value={cat.id}>{cat.icon} {cat.name}</option>)}
                                </select>
                            </div>
                            <div className="input-group">
                                <label>التاريخ</label>
                                <input type="date" value={date} onChange={(e) => setDate(e.target.value)} />
                            </div>
                            <button onClick={addExpense}>✓ إضافة</button>
                        </div>

                        <div>
                            <div className="stat-card">
                                <h3>إجمالي المصاريف</h3>
                                <div className="value">{monthTotal.toLocaleString('ar-SA')} <span style={{fontSize: '16px'}}>ر.س</span></div>
                            </div>
                            <div className="stats-grid" style={{marginTop: '16px'}}>
                                <div className="stat-card small">
                                    <h3>متوسط يومي</h3>
                                    <div className="value">{avgDaily} ر.س</div>
                                </div>
                                <div className="stat-card small">
                                    <h3>عدد المعاملات</h3>
                                    <div className="value">{filteredExpenses.length}</div>
                                </div>
                            </div>
                            {topCategory && (
                                <div className="stat-card small" style={{marginTop: '16px'}}>
                                    <h3>الفئة الأعلى</h3>
                                    <div style={{display: 'flex', alignItems: 'center', gap: '8px', marginTop: '8px'}}>
                                        <span>{topCategory.icon}</span>
                                        <span style={{flex: 1}}>{topCategory.name}</span>
                                        <span style={{fontWeight: 'bold'}}>{topCategory.total} ر.س</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="filter-section">
                        <label>اختر الشهر:</label>
                        <input type="month" value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} />
                        <button className="print-btn" onClick={() => window.print()}>📥 طباعة التقرير</button>
                    </div>

                    <div className="expenses-list">
                        <div className="list-header">
                            <h3>قائمة المصاريف</h3>
                        </div>
                        <div className="list-items">
                            {filteredExpenses.length === 0 ? (
                                <div className="empty-message">لا توجد مصاريف في هذا الشهر</div>
                            ) : (
                                filteredExpenses.sort((a, b) => new Date(b.date) - new Date(a.date)).map(expense => {
                                    const cat = categories.find(c => c.id === expense.category);
                                    return (
                                        <div key={expense.id} className="list-item">
                                            <div className="list-item-left">
                                                <div className="list-item-icon">{cat?.icon}</div>
                                                <div className="list-item-info">
                                                    <h4>{expense.description}</h4>
                                                    <p>{cat?.name} • {new Date(expense.date).toLocaleDateString('ar-SA')}</p>
                                                </div>
                                            </div>
                                            <div className="list-item-right">
                                                <div className="list-item-amount">{expense.amount.toLocaleString('ar-SA')} ر.س</div>
                                                <button className="delete-btn" onClick={() => deleteExpense(expense.id)}>🗑️</button>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ExpenseTracker />);
    </script>
</body>
</html>
